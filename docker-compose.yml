networks:
  dc_local_net:
    driver: bridge
  host_a_net:
    driver: bridge
  host_b_net:
    driver: bridge

services:
  master-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: master-dispatcher
    ports:
      - "8000:8000"
    networks:
      - dc_local_net
      - host_a_net
      - host_b_net

  vm-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: vm-worker-1
    ports:
      - "8001:8000"
    environment:
      - VM_ID=vm-worker-1
      - CAPACITY_MULTIPLIER=2.0
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    networks:
      - host_a_net

  vm-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: vm-worker-2
    ports:
      - "8002:8000"
    environment:
      - VM_ID=vm-worker-2
      - CAPACITY_MULTIPLIER=1.0
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    networks:
      - host_a_net

  vm-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: vm-worker-3
    ports:
      - "8003:8000"
    environment:
      - VM_ID=vm-worker-3
      - CAPACITY_MULTIPLIER=1.5
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    networks:
      - host_b_net

  vm-worker-4:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: vm-worker-4
    ports:
      - "8004:8000"
    environment:
      - VM_ID=vm-worker-4
      - CAPACITY_MULTIPLIER=0.8
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    networks:
      - host_b_net
